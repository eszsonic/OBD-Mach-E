[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mache-obd"
version = "0.1.0"
description = "Read-only UDS probe for the Ford Mustang Mach-E over an ELM327/STN Bluetooth adapter (power-limit diagnosis)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mache-obd = "mache_obd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
